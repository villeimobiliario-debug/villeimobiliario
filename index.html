<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>VILLE Imobiliário | Teste de publicação</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #0a1020; color: #f8fafc; padding: 24px; }
    main { max-width: 600px; width: 100%; padding: 48px 36px; background: #111b31; border: 1px solid #253452; border-radius: 24px; text-align: center; }
    .brand { font-size: 18px; letter-spacing: .24em; font-weight: 800; color: #82aaff; }
    h1 { font-size: clamp(30px, 5vw, 42px); margin: 20px 0 16px; }
    p { color: #b9c5d9; line-height: 1.6; }
    .tag { display: inline-block; margin-top: 24px; padding: 10px 18px; border-radius: 999px; background: #143d31; color: #a6f2cf; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <div class="brand">VILLE</div>
    <h1>VILLE Imobiliário</h1>
    <p>Ambiente de testes. Esta página foi criada para verificar a integração entre GitHub e Cloudflare.</p>
    <span class="tag">Teste inicial de publicação</span>
  </main>
</body>
</html>
